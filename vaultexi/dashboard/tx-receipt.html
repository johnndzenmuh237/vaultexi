<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaction receipt — Vaultex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<style>
  body { background: var(--ink, #0b1020); color: var(--paper, #fff); font-family: 'Inter', sans-serif; margin: 0; padding: 24px 14px 60px; }
  .rc-wrap { max-width: 560px; margin: 0 auto; }
  .rc-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
  .rc-top a, .rc-top button { font-size: .82rem; color: var(--muted, #8993AB); background: none; border: 1px solid var(--line, #262E45); border-radius: 8px; padding: 8px 14px; cursor: pointer; text-decoration: none; font-family: inherit; }
  .rc-card { background: var(--ink-soft, #121a30); border: 1px solid var(--line, #262E45); border-radius: 18px; padding: 26px 22px; position: relative; overflow: hidden; }
  .rc-demo { background: rgba(245,166,35,.14); border: 1px solid rgba(245,166,35,.45); color: #F5A623; font-size: .74rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; text-align: center; padding: 8px 10px; border-radius: 8px; margin-bottom: 20px; }
  .rc-head { text-align: center; margin-bottom: 20px; }
  .rc-check { width: 52px; height: 52px; border-radius: 50%; background: rgba(22,199,132,.15); color: #16c784; display: inline-flex; align-items: center; justify-content: center; font-size: 1.6rem; margin-bottom: 10px; }
  .rc-head h1 { font-family: 'Space Grotesk', sans-serif; font-size: 1.25rem; margin: 0 0 4px; }
  .rc-amount { font-family: 'JetBrains Mono', monospace; font-size: 1.7rem; font-weight: 700; margin: 6px 0 2px; }
  .rc-usd { color: var(--muted, #8993AB); font-size: .9rem; }
  .rc-row { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-top: 1px solid var(--line, #262E45); font-size: .84rem; }
  .rc-row .k { color: var(--muted, #8993AB); flex-shrink: 0; }
  .rc-row .v { font-family: 'JetBrains Mono', monospace; text-align: right; word-break: break-all; font-size: .78rem; }
  .rc-ok { color: #16c784; font-weight: 700; }
  .rc-foot { margin-top: 16px; font-size: .7rem; color: var(--muted, #8993AB); text-align: center; line-height: 1.5; }
  .rc-brand { text-align: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; margin-bottom: 14px; letter-spacing: .02em; }
  @media print { .rc-top { display: none; } body { background: #fff; color: #000; } }
</style>
</head>
<body>
<div class="rc-wrap">
  <div class="rc-top">
    <a href="transactions.html">← All transactions</a>
    <button id="rc-print">Print / Save PDF</button>
  </div>
  <div class="rc-card" id="rc-card">
    <div class="rc-brand">Vaultex</div>
    <div class="rc-demo">Demo transaction · simulated · no real funds moved</div>
    <div id="rc-body"><p style="text-align:center;color:var(--muted)">Loading receipt…</p></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../assets/js/firebase-init.js"></script>
<script src="../assets/js/auth-guard.js"></script>
<script src="../assets/js/demo-ledger.js"></script>
<script>
(function () {
  'use strict';
  const V = window.VaultexDemo;
  const body = document.getElementById('rc-body');
  const id = new URLSearchParams(location.search).get('id');
  document.getElementById('rc-print').addEventListener('click', () => window.print());

  function row(k, v, cls) { return `<div class="rc-row"><span class="k">${k}</span><span class="v ${cls || ''}">${v}</span></div>`; }

  function renderFull(t) {
    const isDep = t.type === 'deposit';
    const when = new Date(t.createdAtMs);
    body.innerHTML = `
      <div class="rc-head">
        <div class="rc-check">✓</div>
        <h1>${isDep ? 'Deposit' : 'Withdrawal'} ${V.esc(t.status)}</h1>
        <div class="rc-amount">${isDep ? '+' : '−'}${V.fmtQty(t.qty)} ${V.esc(t.coin)}</div>
        <div class="rc-usd">≈ ${V.fmtUSD(t.usd)}</div>
      </div>
      ${row('Status', V.esc(t.status), 'rc-ok')}
      ${row('Confirmations', t.confirmations + '/' + t.requiredConfirmations)}
      ${row('Date', V.esc(when.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' })))}
      ${row('Time', V.esc(when.toLocaleTimeString()))}
      ${row('Coin', V.esc(t.coinName) + ' (' + V.esc(t.coin) + ')')}
      ${row('Network', V.esc(t.network))}
      ${row('Rate', '1 ' + V.esc(t.coin) + ' = ' + V.fmtUSD(t.price))}
      ${row('From wallet', V.esc(t.fromAddress))}
      ${row('To wallet', V.esc(t.toAddress))}
      ${row('Block', V.esc(t.block))}
      ${row('Transaction hash', V.esc(t.hash))}
      ${row('Reference', V.esc(t.id))}
      <div class="rc-foot">Demo/testing record generated by Vaultex. The hash and addresses are simulated and do not exist on any blockchain.</div>`;
  }

  auth.onAuthStateChanged(async u => {
    if (!u) return;
    if (!id) { body.innerHTML = '<p style="text-align:center">No transaction specified.</p>'; return; }
    try {
      const t = await V.getTransaction(u.uid, id);
      if (!t) { body.innerHTML = '<p style="text-align:center">Transaction not found.</p>'; return; }
      renderFull(t);
    } catch (e) {
      console.error(e);
      body.innerHTML = '<p style="text-align:center">Could not load this transaction.</p>';
    }
  });
})();
</script>
</body>
</html>
